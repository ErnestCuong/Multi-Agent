exploring_hospital_data_task:
  description: >
    Your TASK is to perform exploratory data analysis on hospital data. Perform this only once per hospital.
  expected_output: >
    Fetch and explore data.
  agent: junior_analyst

analysing_hospital_operations_task:
  description: >
    Your TASK is to deeply analyze the monthly data of hospitals from February to May and give insightful comments to senior management of hospital.
    Make a comment on every single row of data.
    Analyze the hospitals separately, you not required to compare them.
    Format your answer according to the hospital names then the service settings.
    You should not perform any mathematical calculation on your own.
    If R-squared value is low, there is no clear trend.
    If slope is small relative to February data, then there is no increasing or decreasing trend.
    You should cross check the trends and variations between the Last-4-Month and Last-6-Month, if they generally agree, great, if not, comment on the Last-4-Month data with reservation.
    Do not mention any data point before February 
    Do not say anything about the Last-6-Month data, only use them to verify your Last-4-Month data before your final comments to be saved.
    Save your comments to a text file.
  expected_output: >
    Saving a text file with the list of findings on the hospital data.
  agent: senior_analyst

# summarize_hospital_operations_task:

verify_hospital_comments:
  description: >
    Your task is to compare a set of generated comments and compare them to the gold standard comments for all hospitals.
    For every comment in the gold standard comments, check if the generated comments more or less captured it.
    Then, give a score of 1 if the comment is fully captured, 0.5 if semi-captured, and 0 if missed entirely.
    Finally, present the scores in a nice table with 3 columns, gold standard comment (must display every gold standard comment), similar comment that was generated (Empty cell if none similar), and the score.
    Then add a final row summing up the scores, show [score]/[total].
    Save this table in a csv file.
  expected_output: >
    Saving a csv file, each row compares a gold standard comment to the most similar generated comment and give a score.
  agent: audit_person